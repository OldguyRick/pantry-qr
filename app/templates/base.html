<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pantry QR{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥫</text></svg>">
</head>
<body>
<header class="top">
  <a class="brand" href="/">🥫 Pantry QR</a>
  <nav>
    <a href="/scan">Scan</a>
    <a href="/labels">Labels</a>
    <a href="/log">Log</a>
    <a class="cta" href="/items/new">+ Item</a>
  </nav>
</header>
<main>
  {% if msg %}<p class="flash ok">{{ msg }}</p>{% endif %}
  {% if err %}<p class="flash bad">{{ err }}</p>{% endif %}
  {% block body %}{% endblock %}
</main>
<footer>
  <span>Pantry QR · FastAPI + Postgres on Render</span>
  <span class="mono">{{ request.url.hostname }}</span>
</footer>
</body>
</html>
