{% extends "base.html" %}
{% block title %}Add item · Pantry QR{% endblock %}
{% block body %}
<header class="page-head">
  <div>
    <p class="eyebrow">New item</p>
    <h1>Add an item</h1>
    <p class="sub">A QR code is generated the moment you save — print it from the item page.</p>
  </div>
</header>

<form method="post" action="/items" class="form-card" style="max-width:640px">
  <div class="field">
    <label for="name">Name</label>
    <input id="name" name="name" required placeholder="Rolled oats" autofocus>
  </div>
  <div class="field">
    <label for="description">Description</label>
    <input id="description" name="description" placeholder="Organic, resealed bag">
  </div>
  <div class="form-grid">
    <div class="field">
      <label for="size">Size</label>
      <input id="size" name="size" placeholder="1 kg">
    </div>
    <div class="field">
      <label for="quantity">Quantity</label>
      <input id="quantity" type="number" name="quantity" value="1" min="1">
    </div>
  </div>
  <div class="form-grid">
    <div class="field">
      <label for="added_on">Added</label>
      <input id="added_on" type="date" name="added_on" value="{{ today }}">
    </div>
    <div class="field">
      <label for="best_before">Best before</label>
      <input id="best_before" type="date" name="best_before">
    </div>
  </div>
  <div class="field">
    <label for="container">Container</label>
    <select id="container" name="container">
      <option value="">— unassigned —</option>
      {% for c in containers %}
      <option value="{{ c.code }}" {{ "selected" if c.code == preset else "" }}>{{ c.name }} ({{ c.code }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Save item + QR</button>
    <a class="small" href="/">Cancel</a>
  </div>
</form>
{% endblock %}
