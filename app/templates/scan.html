{% extends "base.html" %}
{% block title %}Scan · Pantry QR{% endblock %}
{% block body %}
<h1>Scan a code</h1>
<p class="muted">Point the camera at a bin or item label. The page it opens is live, so it always shows the current contents.</p>

<div id="reader" style="max-width:460px"></div>
<p class="hint" id="status">Waiting for camera permission…</p>

<h2>No camera handy?</h2>
<form class="row" style="max-width:460px" onsubmit="go(event)">
  <input id="manual" placeholder="Type a bin code, e.g. BIN-A1">
  <button type="submit">Open</button>
</form>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  function go(e) {
    e.preventDefault();
    const v = document.getElementById('manual').value.trim().toUpperCase();
    if (!v) return;
    location.href = v.startsWith('BIN-') ? '/c/' + v : '/i/' + v;
  }

  function onScan(text) {
    if (/^https?:\/\//i.test(text)) { location.href = text; return; }
    if (/^BIN-/i.test(text)) { location.href = '/c/' + text.toUpperCase(); return; }
    location.href = '/i/' + text.trim();
  }

  (function start() {
    const status = document.getElementById('status');
    if (!window.Html5Qrcode) { status.textContent = 'Scanner library failed to load — use the manual box below.'; return; }
    const scanner = new Html5Qrcode('reader', { verbose: false });
    let done = false;
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => { if (done) return; done = true; status.textContent = 'Found: ' + text; setTimeout(() => onScan(text), 250); },
      () => {}
    ).then(() => { status.textContent = 'Scanning…'; })
     .catch((err) => { status.textContent = 'Camera unavailable (' + err + '). Use the manual box below.'; });
  })();
</script>
{% endblock %}
