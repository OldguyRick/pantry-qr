{% extends "base.html" %}
{% block title %}Scan · Pantry QR{% endblock %}
{% block body %}
<header class="page-head">
  <div>
    <p class="eyebrow">Scanner</p>
    <h1>Scan a code</h1>
    <p class="sub">Point the camera at a bin or item label — the page it opens is live.</p>
  </div>
</header>

<div class="scanner">
  <div class="scanner-frame">
    <div id="reader"></div>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </div>
  <p class="hint" id="status">Waiting for camera permission…</p>
</div>

<div class="section-head"><h2>No camera handy?</h2></div>
<form class="row" style="max-width:460px" onsubmit="go(event)">
  <input id="manual" placeholder="Type a bin code, e.g. BIN-A1" aria-label="Bin code" style="flex:1">
  <button class="btn btn-primary" type="submit">Open</button>
</form>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  function go(e) {
    e.preventDefault();
    const v = document.getElementById('manual').value.trim().toUpperCase();
    if (!v) return;
    location.href = v.startsWith('BIN-') ? '/c/' + v : '/i/' + v;
  }

  function onScan(text) {
    if (/^https?:\/\//i.test(text)) { location.href = text; return; }
    if (/^BIN-/i.test(text)) { location.href = '/c/' + text.toUpperCase(); return; }
    location.href = '/i/' + text.trim();
  }

  (function start() {
    const status = document.getElementById('status');
    const frame = document.querySelector('.scanner-frame');
    const fail = (msg) => {
      frame.classList.add('is-hidden');
      status.textContent = msg;
      status.classList.add('status-note');
    };
    if (!window.Html5Qrcode) {
      fail('Scanner library failed to load — use the manual box below.');
      return;
    }
    const scanner = new Html5Qrcode('reader', { verbose: false });
    let done = false;
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => { if (done) return; done = true; status.textContent = 'Found: ' + text; setTimeout(() => onScan(text), 250); },
      () => {}
    ).then(() => { status.textContent = 'Scanning…'; })
     .catch(() => { fail('No camera permission here — type a code below, or open the app on a phone.'); });
  })();
</script>
{% endblock %}
